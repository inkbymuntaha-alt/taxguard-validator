<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaxGuard: GST Invoice CSV Validator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-5 max-w-2xl mx-auto">
<h1 class="text-2xl font-bold">TaxGuard GST Validator</h1>
<p class="text-sm text-slate-400 mb-1">Free error scan. Pay 149 USDC on Base for 30 days of corrected CSV downloads.</p>
<p class="text-xs text-slate-500 mb-4">Pre-check tool only, not tax advice. Verify before filing.</p>
<input type="file" accept=".csv" onchange="loadFile(event)" class="text-xs mb-2">
<textarea id="csv" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded p-3 font-mono text-xs">invoice_number,supplier_gstin,customer_gstin,hsn_sac,taxable_value,tax_rate,cgst,sgst,igst
INV-001,27AAFCC9980M1ZR,29AAFCC9980M1Z5,998314,50000,18,0,0,9000
INV-002,27AAFCC9980M1ZR,27AAFCC9980M1ZR,998314,10000,18,0,0,1800</textarea>
<div class="flex flex-wrap gap-2 mt-3">
<button onclick="run(false)" class="bg-slate-700 px-4 py-2 rounded text-sm">Free scan</button>
<button onclick="pay()" class="bg-blue-600 px-4 py-2 rounded text-sm">Pay 149 USDC (MetaMask)</button>
<button onclick="run(true)" class="bg-emerald-600 px-4 py-2 rounded text-sm">Download clean CSV</button>
</div>
<p id="msg" class="text-xs text-blue-400 font-mono mt-3 break-all"></p>
<p id="stats" class="text-sm mt-3"></p>
<div id="out" class="space-y-2 mt-2 text-xs"></div>
<script>
const WALLET="0x960E510E4E1dA4B13CE3b601202d4680AFcf02E0".toLowerCase();
const USDC="0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913".toLowerCase();
const TRANSFER="0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
const PRICE=149, DAYS=30, RPC="https://mainnet.base.org";
const CH="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const STATES=new Set([...Array(38).keys()].map(i=>String(i+1).padStart(2,'0')).filter(s=>s!=="25"&&s!=="28").concat("97"));
const $=id=>document.getElementById(id);
const say=m=>{$('msg').textContent=m};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tx=localStorage.getItem('tg_tx')||'', acct=localStorage.getItem('tg_acct')||'';

function loadFile(e){const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=x=>{$('csv').value=x.target.result};r.readAsText(f);}

function parseCSV(t){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'&&t[i+1]=='"'){cur+='"';i++;} else if(c=='"')q=false; else cur+=c; }
    else if(c=='"')q=true;
    else if(c==','){row.push(cur);cur='';}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n')i++; row.push(cur);cur=''; if(row.some(x=>x.trim()))rows.push(row); row=[]; }
    else cur+=c;
  }
  row.push(cur); if(row.some(x=>x.trim()))rows.push(row);
  const h=(rows.shift()||[]).map(x=>x.trim());
  return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));
}

function gstinErr(g){
  g=(g||'').trim().toUpperCase();
  if(g.length!==15)return 'must be 15 characters';
  if(!STATES.has(g.slice(0,2)))return 'invalid state code '+g.slice(0,2);
  if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))return 'invalid format';
  let s=0;
  for(let i=0;i<14;i++){const p=CH.indexOf(g[i])*(i%2===0?1:2);s+=Math.floor(p/36)+p%36;}
  if(CH[(36-s%36)%36]!==g[14])return 'checksum mismatch';
  return null;
}

const toC=v=>Math.round(parseFloat(v||0)*100);
const f2=c=>(c/100).toFixed(2);

function check(r){
  const errs=[];
  const inv=(r.invoice_number||'').trim();
  const sg=(r.supplier_gstin||'').trim().toUpperCase();
  const cg=(r.customer_gstin||'').trim().toUpperCase();
  const hsn=(r.hsn_sac||'').trim();
  if(!inv||inv.length>16)errs.push('Invoice number missing or longer than 16 characters');
  let e=gstinErr(sg); if(e)errs.push('Supplier GSTIN: '+e);
  if(cg){e=gstinErr(cg); if(e)errs.push('Customer GSTIN: '+e);}
  if(!/^\d+$/.test(hsn)||![4,6,8].includes(hsn.length))errs.push("HSN/SAC '"+hsn+"' must be 4, 6 or 8 digits");
  let t=toC(r.taxable_value),c=toC(r.cgst),s=toC(r.sgst),i=toC(r.igst);
  const rate=parseFloat(r.tax_rate||18);
  if(isNaN(t)||isNaN(rate)||isNaN(c)||isNaN(s)||isNaN(i)){errs.push('Number parsing error');t=c=s=i=0;}
  else{
    const tax=Math.round(t*rate/100);
    const sup=sg.slice(0,2), pos=cg?cg.slice(0,2):String(r.place_of_supply||sup).padStart(2,'0');
    if(sup&&pos){
      if(sup===pos){const h=Math.round(tax/2);
        if(i!==0||c!==h||s!==h){errs.push('Same-state supply: expected CGST '+f2(h)+' + SGST '+f2(h)+', IGST 0');c=h;s=h;i=0;}}
      else if(c!==0||s!==0||i!==tax){errs.push('Interstate supply '+sup+' to '+pos+': expected IGST '+f2(tax)+' only');c=0;s=0;i=tax;}
    }
  }
  return {inv,status:errs.length?'FAIL':'PASS',errs,
    clean:[inv,sg,cg,hsn,f2(t),f2(c),f2(s),f2(i),f2(t+c+s+i)]};
}

async function rpc(method,params){
  const r=await fetch(RPC,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
  return (await r.json()).result;
}

async function isPaid(){
  if(!/^0x[0-9a-f]{64}$/.test(tx)||!acct)return false;
  try{
    const rc=await rpc('eth_getTransactionReceipt',[tx]);
    if(!rc||rc.status!=='0x1'||rc.from.toLowerCase()!==acct.toLowerCase())return false;
    const b=await rpc('eth_getBlockByNumber',[rc.blockNumber,false]);
    if(Date.now()/1000-parseInt(b.timestamp,16)>DAYS*86400)return false;
    const to='0x'+WALLET.slice(2).padStart(64,'0');
    return rc.logs.some(l=>{const t=l.topics.map(x=>x.toLowerCase());
      return l.address.toLowerCase()===USDC&&t.length>=3&&t[0]===TRANSFER&&t[2]===to&&BigInt(l.data)>=BigInt(PRICE)*1000000n;});
  }catch(e){return false;}
}

async function pay(){
  if(!window.ethereum){location.href='https://metamask.app.link/dapp/'+location.host+location.pathname;return;}
  try{
    const [from]=await ethereum.request({method:'eth_requestAccounts'});
    try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x2105'}]});}
    catch(e){if(e.code!==4902)throw e;
      await ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:'0x2105',chainName:'Base',
        nativeCurrency:{name:'Ether',symbol:'ETH',decimals:18},rpcUrls:[RPC],blockExplorerUrls:['https://basescan.org']}]});}
    const data='0xa9059cbb'+WALLET.slice(2).padStart(64,'0')+(BigInt(PRICE)*1000000n).toString(16).padStart(64,'0');
    say('Confirm payment in MetaMask...');
    tx=(await ethereum.request({method:'eth_sendTransaction',params:[{from,to:USDC,data}]})).toLowerCase();
    acct=from.toLowerCase();
    localStorage.setItem('tg_tx',tx);localStorage.setItem('tg_acct',acct);
    for(let n=1;n<=15;n++){
      say('Waiting for confirmation ('+n+'/15)...');
      await new Promise(r=>setTimeout(r,2000));
      if(await run(true,true))return;
    }
    say('Not confirmed yet. Tap "Download clean CSV" in a minute.');
  }catch(e){say('Failed: '+(e.message||e));}
}

async function run(dl,quiet){
  const res=parseCSV($('csv').value).map(check);
  const failed=res.filter(x=>x.status==='FAIL').length;
  $('stats').textContent='Total '+res.length+' | Passed '+(res.length-failed)+' | Failed '+failed;
  $('out').innerHTML=res.map(x=>'<div class="border border-slate-700 rounded p-2"><b>'+esc(x.inv||'?')+'</b> '+x.status+
    '<ul class="list-disc ml-4 text-rose-300">'+x.errs.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>').join('');
  if(!dl)return false;
  if(await isPaid()){
    const head='invoice_number,supplier_gstin,customer_gstin,hsn_sac,taxable_value,cgst,sgst,igst,grand_total';
    const csv=head+'\n'+res.map(x=>x.clean.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='taxguard_clean.csv';a.click();
    say('Payment verified. Downloading.');return true;
  }
  if(!quiet)say('Payment not verified yet.');
  return false;
}
</script></body></html>
